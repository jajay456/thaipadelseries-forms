<!doctype html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Thaipadelseries forms</title>
<link rel="icon" type="image/png" href="./logo.png">
<link rel="apple-touch-icon" href="./logo.png">
<script>
  // ตั้งธีมที่เลือกไว้ก่อน React โหลด เพื่อไม่ให้จอกะพริบสีผิด
  try {
    var t = JSON.parse(localStorage.getItem("sheetDashboard.theme"));
    document.documentElement.dataset.theme = t === "light" ? "light" : "dark"; // ค่าเริ่มต้น = มืด
  } catch (e) { document.documentElement.dataset.theme = "dark"; }
</script>
